<!doctype html>
<!-- Source for assets/og-image.png (1200x630 social share card). Rendered via headless
     Chromium: screenshot at viewport 1200x630. Regenerate after editing the logo or copy. -->
<html><head><meta charset="utf-8"><style>
  @font-face{font-family:'Inter';src:url('../assets/fonts/inter-latin.woff2') format('woff2');font-weight:300 800;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{width:1200px;height:630px;font-family:'Inter',sans-serif;background:linear-gradient(135deg,#07111f,#0e1b2c 60%,#081220);
       display:flex;align-items:center;justify-content:space-between;padding:80px;color:#f5f7fb;overflow:hidden;position:relative;}
  body::before{content:'';position:absolute;top:-120px;right:-120px;width:420px;height:420px;border-radius:50%;
       background:radial-gradient(circle,rgba(240,195,107,0.28),transparent 70%);}
  body::after{content:'';position:absolute;bottom:-160px;left:-100px;width:420px;height:420px;border-radius:50%;
       background:radial-gradient(circle,rgba(125,211,252,0.20),transparent 70%);}
  .left{max-width:700px;position:relative;z-index:1;}
  .brand{display:flex;align-items:center;gap:16px;margin-bottom:44px;}
  .brand img{width:56px;height:56px;}
  .brand span{font-weight:800;letter-spacing:0.12em;text-transform:uppercase;font-size:22px;}
  .eyebrow{color:#f0c36b;text-transform:uppercase;letter-spacing:0.22em;font-size:18px;font-weight:700;margin-bottom:18px;}
  h1{font-size:52px;font-weight:800;line-height:1.15;margin-bottom:22px;}
  p{font-size:24px;color:#9fb0c8;line-height:1.5;max-width:620px;}
  .badge{position:relative;z-index:1;display:inline-flex;align-items:center;gap:10px;margin-top:34px;
       background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.16);border-radius:999px;padding:12px 20px;font-size:19px;font-weight:600;}
  .dot{width:10px;height:10px;border-radius:50%;background:#34d399;}
</style></head>
<body>
  <div class="left">
    <div class="brand">
      <img src="../assets/brand-mark.svg" />
      <span>Ursila Pradeep</span>
    </div>
    <div class="eyebrow">Software Developer · 42 Heilbronn</div>
    <h1>Software developer who learned the problem before learning to code it.</h1>
    <p>B.E. Computer Science · MBA Supply Chain Management · now writing C at 42 Heilbronn.</p>
    <div class="badge"><span class="dot"></span> Unrestricted right to work in Germany</div>
  </div>
</body></html>
